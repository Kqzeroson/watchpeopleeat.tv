<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("wpe-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>register — watchpeopleeat.tv</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="side-rail left" aria-hidden="true"></div>
<div class="side-rail right" aria-hidden="true"></div>

<div class="topbar">
  <a href="index.html" class="brand"><img src="images/logo.png" alt="watchpeopleeat.tv" class="brand-logo"></a>
  <nav>
    <a href="livestreams.html">Livestreams</a>
    <a href="index.html">Videos</a>
    <a href="eotw.html" class="eotw-link">EOTW</a>
    <a href="explore.html">Explore</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
  <div class="session" id="session-area">loading…</div>
</div>

<div class="panel-box">
  <h2>create account</h2>
  <form id="register-form">
    <div class="field">
      <label for="username">username</label>
      <input type="text" id="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_\-]+" title="letters, numbers, underscore, hyphen only">
    </div>
    <div class="field">
      <label for="email">email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">password</label>
      <input type="password" id="password" required minlength="8">
    </div>
    <button type="submit" class="primary">register</button>
    <div class="msg" id="form-msg"></div>
  </form>
  <p style="font-family:var(--mono); font-size:12px; color:var(--dim);">
    already have an account? <a href="login.html">log in</a>
  </p>
</div>

<div class="footer">watchpeopleeat.tv</div>

<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("form-msg");
  msg.textContent = "creating account…";
  msg.className = "msg";

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: { data: { username } }
  });

  if (error) {
    msg.textContent = error.message;
    msg.className = "msg error";
    return;
  }

  msg.textContent = "account created. check your email to confirm, then log in.";
  msg.className = "msg ok";
});
</script>
</body>
</html>
