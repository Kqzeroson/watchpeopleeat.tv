<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("wpe-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>upload — watchpeopleeat.tv</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="side-rail left" aria-hidden="true"></div>
<div class="side-rail right" aria-hidden="true"></div>

<div class="topbar">
  <a href="index.html" class="brand"><img src="images/logo.png" alt="watchpeopleeat.tv" class="brand-logo"></a>
  <nav>
    <a href="livestreams.html">Livestreams</a>
    <a href="index.html">Videos</a>
    <a href="eotw.html" class="eotw-link">EOTW</a>
    <a href="explore.html">Explore</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
  <div class="session" id="session-area">loading…</div>
</div>

<div class="panel-box" style="max-width:520px;">
  <h2>upload a video</h2>
  <div id="need-login" style="display:none;">
    <p>you need an account to upload. <a href="login.html">log in</a> or <a href="register.html">register</a>.</p>
  </div>
  <form id="upload-form">
    <div class="field">
      <label for="title">title</label>
      <input type="text" id="title" required maxlength="120">
    </div>
    <div class="field">
      <label for="description">description (optional)</label>
      <textarea id="description" rows="3" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label for="tags">tags (comma separated)</label>
      <input type="text" id="tags" placeholder="cereal, competitive-eating, disaster">
    </div>
    <div class="field">
      <label for="video-file">video file</label>
      <input type="file" id="video-file" accept="video/*" required>
    </div>
    <button type="submit" class="primary" id="submit-btn">upload</button>
    <div id="upload-progress-wrap" style="display:none; margin-top:8px;">
      <div style="background:var(--dim); border-radius:6px; overflow:hidden; height:8px;">
        <div id="upload-progress-bar" style="background:var(--lime-dk); height:100%; width:0%; transition:width .2s;"></div>
      </div>
      <div id="upload-progress-label" style="font-family:var(--mono); font-size:11px; color:var(--dim); margin-top:4px;"></div>
    </div>
    <div class="msg" id="form-msg"></div>
  </form>
</div>

<div class="footer">watchpeopleeat.tv</div>

<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@latest/dist/tus.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/upload.js"></script>
</body>
</html>
