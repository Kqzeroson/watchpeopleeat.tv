<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>upload — watchpeopleeat.tv</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">watchpeopleeat<span>.tv</span></div>
  <nav>
    <a href="livestreams.html">Livestreams</a>
    <a href="index.html">Videos</a>
    <a href="eotw.html" class="eotw-link">EOTW</a>
    <a href="explore.html">Explore</a>
  </nav>
  <div class="session" id="session-area">loading…</div>
</div>

<div class="panel-box" style="max-width:520px;">
  <h2>upload a video</h2>
  <div id="need-login" style="display:none;">
    <p>you need an account to upload. <a href="login.html">log in</a> or <a href="register.html">register</a>.</p>
  </div>
  <form id="upload-form">
    <div class="field">
      <label for="title">title</label>
      <input type="text" id="title" required maxlength="120">
    </div>
    <div class="field">
      <label for="description">description (optional)</label>
      <textarea id="description" rows="3" maxlength="1000"></textarea>
    </div>
    <div class="field">
      <label for="tags">tags (comma separated)</label>
      <input type="text" id="tags" placeholder="cereal, competitive-eating, disaster">
    </div>
    <div class="field">
      <label for="video-file">video file</label>
      <input type="file" id="video-file" accept="video/*" required>
    </div>
    <div id="process-panel" style="display:none; border:1px solid var(--dim); border-radius:8px; padding:12px; margin-bottom:14px;">
      <video id="preview-video" style="width:100%; max-height:200px; background:#000;" controls></video>
      <div class="field" style="margin-top:10px;">
        <label>trim range (seconds)</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="number" id="trim-start" min="0" step="0.1" value="0" style="width:90px;">
          <span style="font-family:var(--mono); color:var(--dim);">to</span>
          <input type="number" id="trim-end" min="0" step="0.1" value="0" style="width:90px;">
          <span id="trim-duration" style="font-family:var(--mono); color:var(--dim); font-size:12px;"></span>
        </div>
      </div>
      <div class="field">
        <label for="compress-quality">compression</label>
        <select id="compress-quality">
          <option value="original">original (no compression)</option>
          <option value="high">high quality (720p)</option>
          <option value="medium" selected>medium (720p, smaller file)</option>
          <option value="low">low (480p, smallest file)</option>
        </select>
      </div>
      <div id="estimate-msg" style="font-family:var(--mono); font-size:12px; color:var(--dim);"></div>
    </div>
    <button type="submit" class="primary" id="submit-btn">upload</button>
    <div class="msg" id="form-msg"></div>
  </form>
</div>

<div class="footer">watchpeopleeat.tv</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/upload.js"></script>
</body>
</html>
