<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("wpe-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>log in — watchpeopleeat.tv</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="side-rail left" aria-hidden="true"></div>
<div class="side-rail right" aria-hidden="true"></div>

<div class="topbar">
  <div class="brand">watchpeopleeat<span>.tv</span></div>
  <nav>
    <a href="livestreams.html">Livestreams</a>
    <a href="index.html">Videos</a>
    <a href="eotw.html" class="eotw-link">EOTW</a>
    <a href="explore.html">Explore</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
  <div class="session" id="session-area">loading…</div>
</div>

<div class="panel-box">
  <h2>log in</h2>
  <form id="login-form">
    <div class="field">
      <label for="email">email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="password">password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="primary">log in</button>
    <div class="msg" id="form-msg"></div>
  </form>
  <p style="font-family:var(--mono); font-size:12px; color:var(--dim);">
    no account yet? <a href="register.html">register</a>
  </p>
</div>

<div class="footer">watchpeopleeat.tv</div>

<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("form-msg");
  msg.textContent = "logging in…";
  msg.className = "msg";

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    msg.textContent = error.message;
    msg.className = "msg error";
    return;
  }

  const profile = await getProfile(data.user.id);
  if (profile && profile.is_banned) {
    await supabaseClient.auth.signOut();
    msg.textContent = "this account has been banned.";
    msg.className = "msg error";
    return;
  }

  window.location.href = "index.html";
});
</script>
</body>
</html>
