<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("wpe-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livestreams — watchpeopleeat.tv</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="side-rail left" aria-hidden="true"></div>
<div class="side-rail right" aria-hidden="true"></div>

<div class="topbar">
  <a href="index.html" class="brand"><img src="images/logo.png" alt="watchpeopleeat.tv" class="brand-logo"></a>
  <nav>
    <a href="livestreams.html" class="active">Livestreams</a>
    <a href="index.html">Videos</a>
    <a href="eotw.html" class="eotw-link">EOTW</a>
    <a href="explore.html">Explore</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
  <div class="session" id="session-area">loading…</div>
</div>

<div class="wrap" style="grid-template-columns: 1fr;">
  <main style="max-width:780px; margin:0 auto; width:100%;">
    <h1 style="font-family:var(--display); font-size:24px;">Livestreams</h1>
    <p style="color:var(--dim); font-size:14px;">
      This board doesn't host live video directly — post a link to a stream you're
      already running on YouTube Live or Twitch, and it'll show up embedded here.
    </p>

    <div id="post-stream-area"></div>

    <h3 style="font-family:var(--display); color:var(--dim); font-size:15px; margin-top:26px;">Live now &amp; recent</h3>
    <div id="livestream-list"></div>
  </main>
</div>

<div class="footer">watchpeopleeat.tv</div>

<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/livestreams.js"></script>
</body>
</html>
